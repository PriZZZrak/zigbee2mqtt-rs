[package]
name = "zigbee-apiarist"
version = "0.1.0"
edition = "2021"

[dependencies]
serde_json = "1"
socket2 = "0.6"
tokio = { version = "1", features = ["rt", "sync", "time", "io-util", "macros", "net"] }

[target.'cfg(unix)'.dependencies]
serial2-tokio = { version = "0.1", features = ["unix"] }

[target.'cfg(windows)'.dependencies]
serial2-tokio = { version = "0.1", features = ["windows"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "io-util"] }
