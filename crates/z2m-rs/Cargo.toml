[package]
name = "z2m-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
regex = "1"
serde_json = "1"
serde_yaml_ng = "0.10"
tokio = { version = "1", features = ["rt", "sync", "time", "net", "macros"] }
rumqttc = { version = "0.25", default-features = false }
zigbee-apiarist = { path = "../zigbee-apiarist" }
zigbee-converters = { path = "../zigbee-converters" }
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
base64 = "0.23.1"
md-5 = "0.11.0"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
