[package]
name = "z2m-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt", "sync", "time", "net", "macros"] }
rumqttc = { version = "0.25", default-features = false }
zigbee-apiarist = { path = "../zigbee-apiarist" }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
