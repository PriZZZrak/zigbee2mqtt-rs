[package]
name = "z2m-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zigbee-apiarist = { path = "../zigbee-apiarist" }
zigbee-apiarist-converters = { path = "../zigbee-apiarist-converters" }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
