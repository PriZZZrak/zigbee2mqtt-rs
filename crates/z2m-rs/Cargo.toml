[package]
name = "z2m-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
regex = "1"
serde_json = "1"
serde_yaml_ng = "0.10"
tokio = { version = "1", features = ["rt", "sync", "time", "net", "macros", "signal"] }
rumqttc = { package = "rumqttc-v4-next", version = "0.34", default-features = false, features = ["use-rustls-no-provider"] }
zigbee-apiarist = { path = "../zigbee-apiarist" }
zigbee-converters = { path = "../zigbee-converters" }
converter-runtime = { path = "../converter-runtime" }
converter-artifact = { path = "../converter-artifact" }
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
base64 = "0.23.1"
md-5 = "0.11.0"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12", "logging"] }
rustls-rustcrypto = "0.1.0-pre.0"
rustls-pemfile = "2"
rustls-native-certs = "0.8"

[features]
converter-probe = []

[[bin]]
name = "converter_bridge_probe"
path = "src/bin/converter_bridge_probe.rs"
required-features = ["converter-probe"]

[[bin]]
name = "lazy_bridge_probe"
path = "src/bin/lazy_bridge_probe.rs"
required-features = ["converter-probe"]

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "test-util"] }
