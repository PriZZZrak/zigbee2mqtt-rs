# zigbee2mqtt-rs configuration example
# Copy to configuration.yaml and adjust as needed.

# Serial port settings
serial:
  port: /dev/ttyUSB0
  baudrate: 115200
  # Adapter type: znp (TI CC2531/CC2652), zstack (alias for znp), ezsp (Silicon Labs), auto
  adapter: znp
  rtscts: false

# MQTT broker settings
mqtt:
  # server accepts a host or a URL: mqtt://localhost:1883
  server: mqtt://localhost
  port: 1883
  base_topic: zigbee2mqtt
  client_id: zigbee2mqtt-rs
  # Uncomment for authentication:
  # username: my_user
  # password: my_password
  keepalive: 60

# Allow new devices to join the network on startup.
# Set to false after your devices are paired.
permit_join: true

# Publish Home Assistant MQTT auto-discovery messages.
# Accepts true/false or a mapping: { enabled: true }
homeassistant: true

# Advanced Zigbee network / MQTT publishing settings. Every field defaults
# to the same value zigbee2mqtt itself defaults to, so the whole section
# can be omitted unless you want to override something.
advanced:
  channel: 11
  # output: json (default, required for HA discovery) | attribute | attribute_and_json
  output: json
  log_level: info

devices:
  '0xec1bbdfffeaa66db':
    friendly_name: 'living_room_bulb'