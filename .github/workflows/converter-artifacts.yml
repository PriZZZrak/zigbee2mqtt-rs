name: converter artifacts

# Generates, verifies and publishes the pinned converter artifact.
# The release descriptor packaging/converter-release.json is the single source
# of the tag, artifactId, ABI and upstream versions. A different converter-v*
# tag is rejected, so the package workflow can never point at a mismatched
# release.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the pinned GitHub Release after all gates pass"
        type: boolean
        default: false
  push:
    tags:
      - "converter-v*"

concurrency:
  group: converter-artifacts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Read the pinned release descriptor
        id: pin
        run: |
          set -euo pipefail
          read -r tag artifact abi zh zc z2m < <(node -e '
            const p=require("./packaging/converter-release.json");
            console.log(p.tag,p.artifactId,p.hostAbi,p.zigbeeHerdsman,p.zigbeeHerdsmanConverters,p.zigbee2mqtt);
          ')
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME does not match pinned $tag" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "artifact=$artifact"
            echo "abi=$abi"
            echo "zh=$zh"
            echo "zc=$zc"
            echo "z2m=$z2m"
            echo "base=https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/"
          } >> "$GITHUB_OUTPUT"

      - name: Install the locked upstream packages
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/upstream"
          cp .github/ci/package.json .github/ci/package-lock.json "$RUNNER_TEMP/upstream/"
          npm ci --ignore-scripts --prefix "$RUNNER_TEMP/upstream"
          node -e '
            const root = process.argv[1];
            const pin = require("./packaging/converter-release.json");
            const zh = require(root + "/zigbee-herdsman/package.json").version;
            const zc = require(root + "/zigbee-herdsman-converters/package.json").version;
            if (zh !== pin.zigbeeHerdsman) throw new Error("herdsman " + zh);
            if (zc !== pin.zigbeeHerdsmanConverters) throw new Error("converters " + zc);
          ' "$RUNNER_TEMP/upstream/node_modules"

      - name: Build the behavior probe
        run: cargo build -p converter-runtime --bin runtime_probe

      - name: Generate the artifact twice (determinism)
        env:
          UPSTREAM: ${{ runner.temp }}/upstream/node_modules
          BASE: ${{ steps.pin.outputs.base }}
          ARTIFACT_ID: ${{ steps.pin.outputs.artifact }}
          ABI: ${{ steps.pin.outputs.abi }}
        run: |
          set -euo pipefail
          generate() {
            out=$1
            node tools/artifact-generator/generate.js \
              --converters "$UPSTREAM/zigbee-herdsman-converters" \
              --babel-parser "$UPSTREAM/@babel/parser" \
              --behavior-probe target/debug/runtime_probe \
              --artifact-id "$ARTIFACT_ID" \
              --host-abi "$ABI" \
              --z2m-version "$(node -p 'require("./packaging/converter-release.json").zigbee2mqtt')" \
              --z2m-commit "$(node -p 'require("./packaging/converter-release.json").zigbee2mqttCommit')" \
              --zh-version "${{ steps.pin.outputs.zh }}" \
              --converters-version "${{ steps.pin.outputs.zc }}" \
              --zcl-catalog crates/zigbee-apiarist/src/zspec/zcl/definition/clusters.json \
              --retrieval-url "$BASE" \
              --out "$out"
          }
          generate target/artifact-a
          generate target/artifact-b
          sha256sum target/artifact-a/manifest.json target/artifact-b/manifest.json \
            target/artifact-a/index.z2idx1 target/artifact-b/index.z2idx1 | tee target/determinism.txt
          cmp target/artifact-a/manifest.json target/artifact-b/manifest.json
          cmp target/artifact-a/index.z2idx1 target/artifact-b/index.z2idx1
          node - <<'NODE'
          const fs = require("node:fs");
          const pin = require("./packaging/converter-release.json");
          const m = JSON.parse(fs.readFileSync("target/artifact-a/manifest.json", "utf8"));
          if (m.artifactId !== pin.artifactId) throw new Error("artifactId");
          if (m.host.abi !== pin.hostAbi) throw new Error("abi");
          if (m.modules.retrieval !== process.env.BASE) throw new Error("retrieval");
          NODE

      - name: Manifest, graph and split gates
        env:
          UPSTREAM: ${{ runner.temp }}/upstream/node_modules
        run: |
          set -euo pipefail
          cargo run -q -p converter-artifact --bin manifest_verify -- target/artifact-a | tee target/manifest-verify.json
          node tools/artifact-generator/check-manifest-gates.js target/artifact-a | tee target/manifest-gates.json

      - name: Resolver differential
        env:
          UPSTREAM: ${{ runner.temp }}/upstream/node_modules
        run: |
          set -euo pipefail
          node tools/artifact-generator/resolver-oracle.js \
            --converters "$UPSTREAM/zigbee-herdsman-converters" \
            --index target/artifact-a/index.json \
            --out target/resolver-oracle.json
          cargo run -q -p converter-artifact --bin resolver_diff -- \
            --index-json target/artifact-a/index.json \
            --index-bin target/artifact-a/index.z2idx1 \
            --oracle target/resolver-oracle.json | tee target/resolver-diff.json
          python3 - <<'PY'
          import json
          d=json.load(open("target/resolver-diff.json"))
          assert d["cases"] == 11562, d
          assert d["jsonFailures"] == 0 and d["binaryFailures"] == 0, d
          PY

      - name: ZCL, ZDO and frame-option differentials
        run: |
          cargo test -q -p zigbee-apiarist --test differential_zcl_pinned \
            --test differential_frame_options --test differential_zdo_frames

      - name: Golden runtime parity
        env:
          UPSTREAM: ${{ runner.temp }}/upstream/node_modules
        run: |
          set -euo pipefail
          target/debug/runtime_probe --mode all --warmup 0 --jobs 8 \
            --max-concurrent 4 --timeout-ms 60000 \
            --package "$UPSTREAM/zigbee-herdsman-converters" \
            --herdsman "$UPSTREAM/zigbee-herdsman" \
            --scenarios tools/engine-study/fixtures/scenarios.json \
            --external tools/bench/fixtures/external/L101Ze_z2m.js > target/parity.json
          python3 tools/bench/check_golden.py target/parity.json

      - name: Stage flat release assets and checksums
        run: |
          set -euo pipefail
          node tools/artifact-generator/stage-release-assets.js target/artifact-a target/release-assets | tee target/assets.json
          (cd target/release-assets && sha256sum * > ../SHA256SUMS)
          cp target/SHA256SUMS target/release-assets/SHA256SUMS
          test "$(ls target/release-assets | wc -l)" -le 1000
          node tools/artifact-generator/verify-release.js \
            target/release-assets packaging/converter-release.json \
            "${{ steps.pin.outputs.base }}" | tee target/release-verify.json

      - uses: actions/upload-artifact@v4
        with:
          name: converter-artifacts-${{ steps.pin.outputs.tag }}
          path: |
            target/artifact-a
            target/release-assets
            target/*.json
            target/*.txt

      - name: Publish the pinned GitHub Release
        if: github.ref_type == 'tag' || inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.pin.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; refusing to overwrite" >&2
            exit 1
          fi
          gh release create "$TAG" --draft --latest=false \
            --title "Converter artifacts $TAG" \
            --notes "Verified converter artifacts. manifest/index hashes are in manifest.json and SHA256SUMS."
          # Marker: only a draft created by this run may be removed on failure.
          touch "$RUNNER_TEMP/draft-created"
          find target/release-assets -maxdepth 1 -type f -print0 | \
            xargs -0 -n 20 gh release upload "$TAG"
          remote=$(gh release view "$TAG" --json assets --jq '.assets | length')
          local=$(ls target/release-assets | wc -l)
          test "$remote" -eq "$local"
          gh release edit "$TAG" --draft=false --latest=false

      - name: Remove only this run's partial draft
        if: failure() && (github.ref_type == 'tag' || inputs.publish)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.pin.outputs.tag }}
        run: |
          if [ -f "$RUNNER_TEMP/draft-created" ]; then
            gh release delete "$TAG" --yes
          else
            echo "no draft created by this run; nothing to delete"
          fi
