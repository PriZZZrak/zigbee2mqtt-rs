name: windfront package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Windfront version (defaults to packaging/windfront.version)"
        required: false
  push:
    tags:
      - "windfront-v*"

concurrency:
  group: opkg-feed
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          version="${{ github.event.inputs.version }}"
          if [ -z "$version" ]; then
            version=$(tr -d '[:space:]' < packaging/windfront.version)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building zigbee2mqtt-windfront $version"

      - name: Install usign
        run: |
          if command -v usign >/dev/null 2>&1; then exit 0; fi
          git clone --depth 1 https://github.com/openwrt/usign.git /tmp/usign
          cmake -S /tmp/usign -B /tmp/usign/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/usign/build -j"$(nproc)"
          sudo cmake --install /tmp/usign/build

      - name: Download the release tarball
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/windfront"
          url="https://registry.npmjs.org/zigbee2mqtt-windfront/-/zigbee2mqtt-windfront-${VERSION}.tgz"
          curl -fsSL "$url" -o "$RUNNER_TEMP/windfront.tgz"
          tar -C "$RUNNER_TEMP/windfront" -xzf "$RUNNER_TEMP/windfront.tgz"
          node -e '
            const pkg = require(process.argv[1]);
            if (pkg.name !== "zigbee2mqtt-windfront" || pkg.version !== process.env.VERSION) {
              throw new Error(`unexpected package ${pkg.name}@${pkg.version}`);
            }
          ' "$RUNNER_TEMP/windfront/package/package.json"
          sha256sum "$RUNNER_TEMP/windfront.tgz" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA256: $(sha256sum "$RUNNER_TEMP/windfront.tgz" | awk '{print $1}')"

      - name: Build ipk
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/payload"
          mkdir -p "$payload/usr/share/zigbee2mqtt/windfront"
          cp -a "$RUNNER_TEMP/windfront/package/dist/." "$payload/usr/share/zigbee2mqtt/windfront/"
          cp "$RUNNER_TEMP/windfront/package/package.json" "$payload/usr/share/zigbee2mqtt/windfront/package.json"
          if [ -f "$RUNNER_TEMP/windfront/package/LICENSE" ]; then
            cp "$RUNNER_TEMP/windfront/package/LICENSE" "$payload/usr/share/zigbee2mqtt/windfront/LICENSE"
          fi
          mkdir -p "$RUNNER_TEMP/out"
          ./packaging/opkg/build-ipk.sh \
            zigbee2mqtt-windfront "$VERSION" all "" \
            "$payload" "$RUNNER_TEMP/out" \
            "Windfront static UI for Zigbee2MQTT"
          ls -l "$RUNNER_TEMP/out"
          cat "$RUNNER_TEMP/out"/*.meta >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout the opkg feed branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: feed

      - name: Update the opkg feed
        env:
          USIGN_PRIVATE_KEY: ${{ secrets.USIGN_PRIVATE_KEY }}
          USIGN_PUBLIC_KEY: ${{ secrets.USIGN_PUBLIC_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/feed"
          dir="$root/feed"
          mkdir -p "$dir"
          rm -f "$dir/ci-error.txt"
          cp "$RUNNER_TEMP"/out/*.ipk "$RUNNER_TEMP"/out/*.meta "$dir"/
          if [ -n "${USIGN_PRIVATE_KEY:-}" ]; then
            key="$RUNNER_TEMP/usign.key"
            printf '%s\n' "$USIGN_PRIVATE_KEY" > "$key"
            if [ -n "${USIGN_PUBLIC_KEY:-}" ]; then
              printf '%s\n' "$USIGN_PUBLIC_KEY" > "$dir/public.key"
            fi
            ./packaging/opkg/update-feed.sh "$dir" "$key"
          else
            ./packaging/opkg/update-feed.sh "$dir"
          fi
          cat "$dir/Packages" >> "$GITHUB_STEP_SUMMARY"
          cd "$root"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "windfront ${VERSION}"
          git push origin gh-pages

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/windfront-v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/out/*.ipk
          name: "zigbee2mqtt-windfront ${{ steps.version.outputs.version }}"
          tag_name: ${{ github.ref_name }}

      # A failing step is invisible without repository admin access, so the
      # failure is recorded next to the feed on the gh-pages branch.
      - name: Report the failure
        if: failure()
        run: |
          set -uo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          report="$GITHUB_WORKSPACE/feed/feed/ci-error.txt"
          {
            printf 'workflow: windfront-package\nrun: %s\nref: %s\nsha: %s\n' \
              "$run_url" "$GITHUB_REF" "$GITHUB_SHA"
          } > "$report" 2>/dev/null || exit 0
          cd "$GITHUB_WORKSPACE/feed" || exit 0
          git config user.name "github-actions" || exit 0
          git config user.email "github-actions@users.noreply.github.com" || exit 0
          git add -A || exit 0
          git commit -m "ci failure: ${GITHUB_RUN_ID}" || exit 0
          git push origin gh-pages || exit 0
