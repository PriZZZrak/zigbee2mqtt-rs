name: zigbee2mqtt-rs package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: opkg-feed
  cancel-in-progress: false

permissions:
  contents: write

env:
  CI_LOG: ${{ github.workspace }}/ci.log

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout the opkg feed branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: feed

      - name: Prepare the CI log
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"
          : > "$CI_LOG"
          echo "run=$GITHUB_RUN_ID ref=$GITHUB_REF" >> "$CI_LOG"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install usign
        run: |
          if command -v usign >/dev/null 2>&1; then exit 0; fi
          git clone --depth 1 https://github.com/openwrt/usign.git /tmp/usign
          cmake -S /tmp/usign -B /tmp/usign/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/usign/build -j"$(nproc)"
          sudo cmake --install /tmp/usign/build

      - name: Read the pinned converter release
        id: pin
        run: |
          set -euo pipefail
          node - <<'NODE'
          const p = require("./packaging/converter-release.json");
          const out = process.env.GITHUB_OUTPUT;
          const fs = require("node:fs");
          fs.appendFileSync(out, `tag=${p.tag}\nartifactId=${p.artifactId}\nbase=https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${p.tag}/\n`);
          NODE
          if ! gh release view "$(node -p 'require("./packaging/converter-release.json").tag')" >/dev/null 2>&1; then
            echo "pinned converter release is missing; refusing to build a package without its artifact" >&2
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download and verify the pinned release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.pin.outputs.tag }}
          BASE: ${{ steps.pin.outputs.base }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          gh release download "$TAG" --dir "$RUNNER_TEMP/release"
          node tools/artifact-generator/verify-release.js \
            "$RUNNER_TEMP/release" packaging/converter-release.json "$BASE" | tee -a "$CI_LOG"

      - name: Install the locked upstream packages
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/upstream"
          cp .github/ci/package.json .github/ci/package-lock.json "$RUNNER_TEMP/upstream/"
          npm ci --ignore-scripts --prefix "$RUNNER_TEMP/upstream"

      - name: Build the behavior probe and verify local generation matches the release
        env:
          UPSTREAM: ${{ runner.temp }}/upstream/node_modules
          BASE: ${{ steps.pin.outputs.base }}
        run: |
          set -euo pipefail
          cargo build -p converter-runtime --bin runtime_probe
          node tools/artifact-generator/generate.js \
            --converters "$UPSTREAM/zigbee-herdsman-converters" \
            --babel-parser "$UPSTREAM/@babel/parser" \
            --behavior-probe target/debug/runtime_probe \
            --artifact-id "$(node -p 'require("./packaging/converter-release.json").artifactId')" \
            --host-abi "$(node -p 'require("./packaging/converter-release.json").hostAbi')" \
            --z2m-version "$(node -p 'require("./packaging/converter-release.json").zigbee2mqtt')" \
            --z2m-commit "$(node -p 'require("./packaging/converter-release.json").zigbee2mqttCommit')" \
            --zh-version "$(node -p 'require("./packaging/converter-release.json").zigbeeHerdsman')" \
            --converters-version "$(node -p 'require("./packaging/converter-release.json").zigbeeHerdsmanConverters')" \
            --retrieval-url "$BASE" \
            --out target/converter-artifact
          node tools/artifact-generator/check-manifest-gates.js target/converter-artifact | tee -a "$CI_LOG"
          cmp target/converter-artifact/manifest.json "$RUNNER_TEMP/release/manifest.json"
          cmp target/converter-artifact/index.z2idx1 "$RUNNER_TEMP/release/index.z2idx1"
          cmp target/converter-artifact/index.json "$RUNNER_TEMP/release/index.json"
          node -e '
            const fs = require("node:fs");
            const pin = require("./packaging/converter-release.json");
            const m = JSON.parse(fs.readFileSync("target/converter-artifact/manifest.json", "utf8"));
            if (m.artifactId !== pin.artifactId || m.host.abi !== pin.hostAbi) throw new Error("artifact identity");
          '

      - name: Build the static aarch64 binary
        run: |
          set -euo pipefail
          cargo zigbuild --release -p z2m-rs --target aarch64-unknown-linux-musl
          bin="target/aarch64-unknown-linux-musl/release/z2m-rs"
          test -x "$bin"
          file "$bin" | tee -a "$CI_LOG"
          sha256sum "$bin" >> "$GITHUB_STEP_SUMMARY"

      - name: Package version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ -z "$version" ] || [ "$GITHUB_REF_TYPE" != "tag" ]; then
            version="0.0.0-g$(git rev-parse --short HEAD)"
          fi
          windfront=$(tr -d '[:space:]' < packaging/windfront.version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "windfront=$windfront" >> "$GITHUB_OUTPUT"

      - name: Build the ipk through the OpenWrt SDK
        env:
          VERSION: ${{ steps.version.outputs.version }}
          HERDSMAN_DIR: ${{ runner.temp }}/upstream/node_modules/zigbee-herdsman
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y build-essential zstd
          sdk_url="https://downloads.openwrt.org/releases/24.10.8/targets/mediatek/filogic/openwrt-sdk-24.10.8-mediatek-filogic_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
          mkdir -p "$RUNNER_TEMP/sdk"
          curl -fsSL "$sdk_url" | tar -x --zstd -C "$RUNNER_TEMP/sdk" --strip-components=1
          make -C "$RUNNER_TEMP/sdk" defconfig >/dev/null
          bin="target/aarch64-unknown-linux-musl/release/z2m-rs"
          LLVM_STRIP=$(find "${RUSTUP_HOME:-$HOME/.rustup}" -path '*/bin/llvm-strip' | head -n1) \
            sh packaging/openwrt-pkg/build.sh \
              "$RUNNER_TEMP/sdk" "$bin" target/converter-artifact \
              "$RUNNER_TEMP/out" "" "$VERSION" 2>&1 | tee -a "$CI_LOG"
          ls -l "$RUNNER_TEMP/out"
          sha256sum "$RUNNER_TEMP/out"/*.ipk >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the real ipk payload
        env:
          TAG: ${{ steps.pin.outputs.tag }}
        run: |
          set -euo pipefail
          ipk=$(find "$RUNNER_TEMP/out" -name '*.ipk' | head -n1)
          test -n "$ipk"
          work=$(mktemp -d)
          tar -C "$work" -xzf "$ipk"
          tar -C "$work" -xzf "$work/data.tar.gz"
          test -x "$work/usr/bin/zigbee2mqtt-rs"
          cmp "$work/usr/share/zigbee2mqtt-rs/artifact/manifest.json" "$RUNNER_TEMP/release/manifest.json"
          cmp "$work/usr/share/zigbee2mqtt-rs/artifact/index.z2idx1" "$RUNNER_TEMP/release/index.z2idx1"
          test -d "$work/usr/share/zigbee2mqtt-rs/artifact/dist/lib"
          test -d "$work/usr/share/zigbee2mqtt-rs/artifact/dist/converters"
          test ! -e "$work/usr/share/zigbee2mqtt-rs/artifact/dist/devices"
          test -f "$work/etc/init.d/zigbee2mqtt-rs"
          test -f "$work/etc/zigbee2mqtt-rs/mode"
          python3 - "$work/usr/bin/zigbee2mqtt-rs" <<'PY'
          import sys
          data = open(sys.argv[1], 'rb').read(20)
          assert data[:4] == b'\x7fELF', 'not an ELF binary'
          assert data[18:20] == b'\xb7\x00', 'not aarch64'
          PY
          du -sk "$work/usr" | tee -a "$CI_LOG"
          cat "$RUNNER_TEMP/out"/*.meta | tee -a "$CI_LOG"

      - name: Update the opkg feed
        env:
          USIGN_PRIVATE_KEY: ${{ secrets.USIGN_PRIVATE_KEY }}
          USIGN_PUBLIC_KEY: ${{ secrets.USIGN_PUBLIC_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/feed"
          dir="$root/feed"
          mkdir -p "$dir"
          rm -f "$dir/ci-error.txt"
          cp "$RUNNER_TEMP"/out/*.ipk "$RUNNER_TEMP"/out/*.meta "$dir"/
          if [ -n "${USIGN_PRIVATE_KEY:-}" ]; then
            key="$RUNNER_TEMP/usign.key"
            printf '%s\n' "$USIGN_PRIVATE_KEY" > "$key"
            if [ -n "${USIGN_PUBLIC_KEY:-}" ]; then
              printf '%s\n' "$USIGN_PUBLIC_KEY" > "$dir/public.key"
            fi
            ./packaging/opkg/update-feed.sh "$dir" "$key"
          else
            ./packaging/opkg/update-feed.sh "$dir"
          fi
          cat "$dir/Packages" >> "$GITHUB_STEP_SUMMARY"
          cd "$root"
          git add -A
          git commit -m "zigbee2mqtt-rs ${VERSION}"
          git push origin gh-pages

      - name: Report the failure
        if: failure()
        run: |
          set -uo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          report="$GITHUB_WORKSPACE/feed/feed/ci-error.txt"
          {
            printf 'run: %s\nref: %s\nsha: %s\n\n' "$run_url" "$GITHUB_REF" "$GITHUB_SHA"
            tail -n 300 "$CI_LOG" 2>/dev/null || echo "(no captured output)"
          } > "$report" 2>/dev/null || exit 0
          cd "$GITHUB_WORKSPACE/feed" || exit 0
          git add -A || exit 0
          git commit -m "ci failure: ${GITHUB_RUN_ID}" || exit 0
          git push origin gh-pages || exit 0
