name: Rust CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --locked
      - name: Test
        run: cargo test --locked
      - name: Native release build
        run: cargo build --release --locked

  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validator regression tests
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Inventory, evidence and dashboard gate
        run: python3 scripts/parity_report.py --check
      - name: EVID-04 harness smoke (fake reference, not parity)
        run: |
          python3 scripts/evid04_harness.py \
            --fixtures scripts/tests/fixtures/evid04_smoke \
            --reference-cmd "python3 scripts/tests/fake_evid04_reference.py reference" \
            --candidate-cmd "python3 scripts/tests/fake_evid04_reference.py candidate" \
            --skip-pins \
            --report evid04-smoke.json
      - name: Upload EVID-04 smoke report
        uses: actions/upload-artifact@v4
        with:
          name: evid04-smoke
          path: evid04-smoke.json
