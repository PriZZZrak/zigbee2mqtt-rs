name: Convert herdsman-converters
on:
  schedule:
    - cron: '0 3 * * 1' # weekly Monday 03:00 UTC
  workflow_dispatch:
    inputs:
      converters_ref:
        description: 'herdsman-converters tag/commit (e.g. v26.115.1)'
        required: false
        default: 'v26.115.1'
  release:
    types: [published]
  push:
    tags:
      - 'converters-v*'

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve converters ref
        id: ref
        run: |
          REF="${{ inputs.converters_ref }}"
          if [ -z "$REF" ]; then REF="v26.115.1"; fi
          echo "ref=$REF" >> $GITHUB_OUTPUT
          echo "Resolved $REF"
      - uses: actions/checkout@v4
        with:
          repository: Koenkk/zigbee-herdsman-converters
          ref: ${{ steps.ref.outputs.ref }}
          path: hc
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: hc/pnpm-lock.yaml
      - run: pnpm --dir hc install --frozen-lockfile
      - run: pnpm --dir hc run build
      - name: Generate registry
        run: node scripts/gen-registry.mjs hc/dist ${{ steps.ref.outputs.ref }}
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./herdsman-converters
          destination_dir: herdsman-converters/${{ steps.ref.outputs.ref }}
      - name: Update latest pointer
        run: |
          git fetch origin gh-pages || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf . || true
            mkdir -p herdsman-converters
          fi
          mkdir -p herdsman-converters
          rm -rf herdsman-converters/latest
          cp -r herdsman-converters/${{ steps.ref.outputs.ref }} herdsman-converters/latest
          echo "${{ steps.ref.outputs.ref }}" > herdsman-converters/latest/VERSION
          git add herdsman-converters/latest
          git commit -m "Update latest -> ${{ steps.ref.outputs.ref }}" || true
          git push origin gh-pages
