name: Convert herdsman-converters
on:
  schedule:
    - cron: '0 3 * * 1' # weekly Monday 03:00 UTC
  workflow_dispatch:
    inputs:
      converters_ref:
        description: 'herdsman-converters tag/commit (e.g. v26.115.1)'
        required: false
        default: 'v26.115.1'
  release:
    types: [published]
  push:
    tags:
      - 'converters-v*'

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve converters ref
        id: ref
        run: |
          REF="${{ inputs.converters_ref }}"
          if [ -z "$REF" ]; then REF="v26.115.1"; fi
          echo "ref=$REF" >> $GITHUB_OUTPUT
          echo "Resolved $REF"
      - uses: actions/checkout@v4
        with:
          repository: Koenkk/zigbee-herdsman-converters
          ref: ${{ steps.ref.outputs.ref }}
          path: hc
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: hc/pnpm-lock.yaml
      - run: pnpm --dir hc install --frozen-lockfile
      - run: pnpm --dir hc run build
      - name: Generate registry
        run: node scripts/gen-registry.mjs hc/dist ${{ steps.ref.outputs.ref }}

      - name: Verify built JavaScript
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          files=(hc/dist/devices/*.js)
          count=${#files[@]}

          echo "Built JS files: $count"

          if (( count < 300 )); then
            echo "::error::Expected at least 300 JS files, got $count"
            exit 1
          fi

          for file in "${files[@]}"; do
            if ! node --check "$file" > /dev/null; then
              echo "::error file=$file::Invalid JavaScript syntax"
              exit 1
            fi
          done

          echo "Syntax OK: $count files"

      - name: Copy device JS files (JS only, no TS fallback)
        run: |
          mkdir -p herdsman-converters/${{ steps.ref.outputs.ref }}
          cp hc/dist/devices/*.js herdsman-converters/${{ steps.ref.outputs.ref }}/
          # Also copy converters lib JS for fromZigbee/toZigbee
          mkdir -p herdsman-converters/${{ steps.ref.outputs.ref }}/lib
          cp hc/dist/converters/*.js herdsman-converters/${{ steps.ref.outputs.ref }}/lib/ 2>/dev/null || true
          cp hc/dist/lib/*.js herdsman-converters/${{ steps.ref.outputs.ref }}/lib/ 2>/dev/null || true
          ls herdsman-converters/${{ steps.ref.outputs.ref }}/ | wc -l
          cat herdsman-converters/registry.json | head -5
          mv herdsman-converters/registry.json herdsman-converters/${{ steps.ref.outputs.ref }}/registry.json
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./herdsman-converters
          destination_dir: herdsman-converters
          keep_files: true

      - name: Update latest pointer
        shell: bash
        env:
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          set -euo pipefail

          # Fetch the branch after the publish action
          git fetch origin gh-pages

          # Create an isolated worktree
          PAGES_DIR="$(mktemp -d "$RUNNER_TEMP/gh-pages.XXXXXX")"
          git worktree add --detach "$PAGES_DIR" origin/gh-pages

          # Replace only the latest directory
          LATEST="$PAGES_DIR/herdsman-converters/latest"
          SOURCE="herdsman-converters/$REF"

          test -d "$SOURCE"

          rm -rf "$LATEST"
          mkdir -p "$LATEST"
          cp -a "$SOURCE/." "$LATEST/"

          printf '%s\n' "$REF" > "$LATEST/VERSION"

          # Configure Git
          git -C "$PAGES_DIR" config user.name "github-actions[bot]"
          git -C "$PAGES_DIR" config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git -C "$PAGES_DIR" add -A herdsman-converters/latest

          if git -C "$PAGES_DIR" diff --cached --quiet; then
            echo "Latest already up to date"
            exit 0
          fi

          git -C "$PAGES_DIR" commit -m "Update latest -> $REF"
          git -C "$PAGES_DIR" push origin HEAD:gh-pages

