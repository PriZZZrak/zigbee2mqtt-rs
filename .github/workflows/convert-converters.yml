name: Convert herdsman-converters
on:
  schedule:
    - cron: '0 3 * * 1' # weekly Monday 03:00 UTC
  workflow_dispatch:
    inputs:
      converters_ref:
        description: 'herdsman-converters tag/commit (e.g. v26.115.1). Empty = latest upstream release.'
        required: false
        default: ''
  release:
    types: [published]
  push:
    tags:
      - 'converters-v*'

# Guard parallel publications: two runs must never interleave gh-pages writes.
concurrency:
  group: converters-gh-pages
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve converters ref
        id: ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_REF: ${{ inputs.converters_ref }}
        run: |
          set -euo pipefail
          REF="$INPUT_REF"
          if [ -z "$REF" ]; then
            # Auto-detect: latest upstream release (P0 item 4).
            REF=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
              https://api.github.com/repos/Koenkk/zigbee-herdsman-converters/releases/latest \
              | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).tag_name))")
          fi
          if [ -z "$REF" ]; then
            echo "::error::Could not resolve converters ref" && exit 1
          fi
          # Validate: tag must exist upstream, or be a full commit SHA.
          if [[ "$REF" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "Resolved $REF (commit SHA, checkout will verify it)"
          elif git ls-remote --tags --exit-code https://github.com/Koenkk/zigbee-herdsman-converters.git "refs/tags/$REF" > /dev/null; then
            echo "Resolved $REF (upstream tag exists)"
          else
            echo "::error::converters ref $REF is neither a valid upstream tag nor a commit SHA" && exit 1
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: Koenkk/zigbee-herdsman-converters
          ref: ${{ steps.ref.outputs.ref }}
          path: hc
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: hc/pnpm-lock.yaml
      - run: pnpm --dir hc install --frozen-lockfile
      - run: pnpm --dir hc run build

      - name: Verify built JavaScript
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          files=(hc/dist/devices/*.js)
          count=${#files[@]}

          echo "Built JS files: $count"

          if (( count < 300 )); then
            echo "::error::Expected at least 300 JS files, got $count"
            exit 1
          fi

          echo "Checking JavaScript syntax..."

          failed=0

          for file in "${files[@]}"; do
            if ! node --check "$file"; then
              echo "::error file=$file::Invalid JavaScript syntax"
              failed=$((failed + 1))
            fi
          done

          if (( failed > 0 )); then
            echo "::error::$failed JavaScript files failed syntax validation"
            exit 1
          fi

          echo "SUCCESS: All $count JavaScript files passed syntax validation"

      - name: Generate registry (upstream models-index is primary)
        # Exits non-zero on any validation/smoke failure -> publish below never runs.
        run: node scripts/gen-registry.mjs hc/dist ${{ steps.ref.outputs.ref }}
      - name: Stage version + latest in one operation
        run: |
          set -euo pipefail
          REF="${{ steps.ref.outputs.ref }}"
          DEST="herdsman-converters/$REF"
          mkdir -p "$DEST/devices" "$DEST/converters" "$DEST/lib"
          # registry.json/zcl.json are written by gen-registry.mjs (validated).
          test -f "$DEST/registry.json"
          test -f "$DEST/zcl.json"
          # Preserve the compiled dist layout: device modules require
          # ../converters/* and ../lib/* relative to dist/devices/*.
          cp hc/dist/devices/*.js "$DEST/devices/"
          cp hc/dist/converters/*.js "$DEST/converters/"
          cp -r hc/dist/lib/. "$DEST/lib/"
          node scripts/gen-manifest.mjs "$DEST" "$REF"
          python3 scripts/check_package_layout.py "$DEST" "$REF"
          rm -rf herdsman-converters/latest
          cp -r "$DEST" herdsman-converters/latest
          echo "$REF" > herdsman-converters/latest/VERSION
          test -f herdsman-converters/latest/registry.json
          test -f herdsman-converters/latest/manifest.json
          test -f herdsman-converters/latest/VERSION
      - name: Publish to gh-pages (single operation)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./herdsman-converters
          destination_dir: herdsman-converters
          keep_files: true
